<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo — Certification &amp; License Expiry Tracker</title>
<meta name="description" content="A short walkthrough of the Certification & License Expiry Tracker app for monday.com by Casting Karma LLC.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0e1630;--ink2:#5b6576;--soft:#f6f7fb;--line:#e7e9f0;--gold:#c2932f;--gold-hi:#d9b65a}
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);background:#0b1020;font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
  a{color:var(--gold-hi);text-decoration:none}
  .wrap{max-width:980px;margin:0 auto;padding:0 24px}
  header{border-bottom:1px solid rgba(255,255,255,.08)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:66px}
  .brand{display:flex;align-items:center;gap:12px}
  .wm{font-size:18px;font-weight:300;letter-spacing:.3px;color:#fff}
  .wm b{font-weight:700;color:var(--gold-hi)}
  .wm .llc{font-size:10px;font-weight:500;letter-spacing:2px;color:#9aa6c0;display:block;margin-top:-3px}
  .nav .links a{font-size:14px;font-weight:500;color:#c4cce0}
  main{padding:44px 0 64px}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:2.5px;color:var(--gold-hi);margin:0 0 10px}
  h1{color:#fff;font-size:27px;font-weight:600;letter-spacing:-.3px;margin:0 0 8px}
  .sub{color:#aab4cc;font-size:15px;font-weight:300;margin:0 0 26px}
  .videobox{border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.1);box-shadow:0 16px 50px rgba(0,0,0,.45);background:#000}
  video{display:block;width:100%;height:auto}
  .meta{color:#8893ab;font-size:13px;margin-top:18px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="index.html">
      <svg width="34" height="34" viewBox="0 0 100 100" aria-label="Casting Karma">
        <g fill="none" stroke-linecap="round" transform="rotate(152 46 50)">
          <circle cx="46" cy="50" r="15" stroke="#c2932f" stroke-width="5" stroke-dasharray="71 24"/>
          <circle cx="46" cy="50" r="25" stroke="#cda64f" stroke-width="4.2" stroke-dasharray="118 40"/>
          <circle cx="46" cy="50" r="35" stroke="#d8bd86" stroke-width="3.4" stroke-dasharray="165 56"/>
        </g>
        <circle cx="46" cy="50" r="6.5" fill="#c2932f"/>
      </svg>
      <span class="wm">Casting <b>Karma</b><span class="llc">LLC</span></span>
    </a>
    <nav class="links"><a href="index.html">Home</a></nav>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="eyebrow">PRODUCT DEMO</p>
    <h1>Certification &amp; License Expiry Tracker</h1>
    <p class="sub">A short walkthrough — compliance dashboard, expiry tracker, logging a training session, and automatic renewal reminders, all inside monday.com.</p>
    <div class="videobox">
      <video controls preload="metadata" playsinline poster="">
        <source src="demo.mp4" type="video/mp4">
        Your browser doesn't support embedded video. <a href="demo.mp4">Download the demo</a>.
      </video>
    </div>
    <p class="meta">Casting Karma LLC · jaminaustin.ai@gmail.com</p>
  </div>
</main>
</body>
</html>
